---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: cert-domain-tls-key-cloudflare
  namespace: cert-manager
  labels:
    tag: homelab-setup
stringData:
  # IMPORTANT: Replace with your actual Cloudflare API token
  # Generate at: https://dash.cloudflare.com/profile/api-tokens
  # Required permissions: Zone:DNS:Edit, Zone:Zone:Read for all zones
  api-token: "REPLACE_WITH_YOUR_CLOUDFLARE_API_TOKEN"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-issuer-mydomain-dev
  namespace: cert-manager
  labels:
    tag: homelab-setup
spec:
  acme:
    # IMPORTANT: Replace with your actual email address
    email: REPLACE_WITH_YOUR_EMAIL@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cluster-issuer-account-key
    solvers:
      - dns01:
          cloudflare:
            # IMPORTANT: Replace with your actual email address (same as above)
            email: REPLACE_WITH_YOUR_EMAIL@example.com
            apiTokenSecretRef:
              name: cert-domain-tls-key-cloudflare
              key: api-token
